# gh release create --generate-notes（自動生成リリースノート）の分類設定
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: 新機能
      labels: [enhancement, feature]
    - title: 不具合の修正
      labels: [bug]
    - title: ドキュメント
      labels: [documentation]
    - title: 依存関係・CI
      labels: [dependencies, ci]
    - title: その他の変更
      labels: ["*"]
