name: Release

# v0.3.0 のようなタグをpushすると、Firefox用・Chrome用のzipとソースzipをReleaseに添付する。
# 安定版は固定名のzip（chem-extension-firefox.zip / chem-extension-chrome.zip）も添付する。
# v0.4.0-beta.1 のようにハイフンを含むタグはプレリリースとして扱い、「最新版」を更新しない
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Verify that the tag matches the manifest versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          for m in manifest.firefox.json manifest.chrome.json; do
            V=$(node -p "require('./$m').version")
            if [ "$V" != "$TAG_VERSION" ]; then
              echo "::error::$m version ($V) does not match the tag ($TAG_VERSION)"
              exit 1
            fi
          done
      - name: Install test dependencies
        working-directory: tests
        run: npm ci
      - name: Run tests (release gate)
        working-directory: tests
        run: npm run all
      - name: Build
        run: node build.mjs
      - name: Create source archive (for AMO source submission)
        run: git archive --format=zip --prefix="chem-viewer-${GITHUB_REF_NAME}/" -o "dist/chem-viewer-source-${GITHUB_REF_NAME}.zip" HEAD
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 版数入りのzip（例: chem-extension-firefox-v0.3.1.zip）とソースzipは常に添付する
          ASSETS=(dist/*.zip)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            # v0.4.0-beta.1 のような試験版: プレリリース扱いにし、「最新版」は更新しない
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag --prerelease --latest=false
          else
            # 安定版: 固定名のコピーも添付する（releases/latest/download/<固定名> で常に最新版を取得できる）
            mkdir -p dist/latest
            cp dist/chem-extension-firefox-*.zip dist/latest/chem-extension-firefox.zip
            cp dist/chem-extension-chrome-*.zip dist/latest/chem-extension-chrome.zip
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" dist/latest/*.zip --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag --latest
          fi
